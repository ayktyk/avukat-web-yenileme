    <script>
      (function () {
        const analyticsId = "G-0GVCCXHBHJ";
        const interactionEvents = ["pointerdown", "keydown", "touchstart", "scroll"];
        let fallbackTimerId;

        function loadAnalytics() {
          if (window.__vegaAnalyticsLoaded) return;
          window.__vegaAnalyticsLoaded = true;
          cleanup();
          window.dataLayer = window.dataLayer || [];
          window.gtag = function () {
            window.dataLayer.push(arguments);
          };
          window.gtag("js", new Date());
          window.gtag("config", analyticsId);

          const script = document.createElement("script");
          script.async = true;
          script.src = "https://www.googletagmanager.com/gtag/js?id=" + analyticsId;
          document.head.appendChild(script);
        }

        function cleanup() {
          interactionEvents.forEach((eventName) => {
            window.removeEventListener(eventName, loadAnalytics);
          });
          document.removeEventListener("visibilitychange", handleVisibilityChange);
          window.removeEventListener("pagehide", loadAnalytics);
          if (fallbackTimerId) {
            window.clearTimeout(fallbackTimerId);
            fallbackTimerId = undefined;
          }
        }

        function handleVisibilityChange() {
          if (document.visibilityState === "hidden") {
            loadAnalytics();
          }
        }

        function scheduleAnalytics() {
          interactionEvents.forEach((eventName) => {
            window.addEventListener(eventName, loadAnalytics, { once: true, passive: true });
          });
          document.addEventListener("visibilitychange", handleVisibilityChange, { once: true });
          window.addEventListener("pagehide", loadAnalytics, { once: true });
          fallbackTimerId = window.setTimeout(loadAnalytics, 15000);
        }

        if (document.readyState === "complete") {
          scheduleAnalytics();
        } else {
          window.addEventListener("load", scheduleAnalytics, { once: true });
        }
      })();
    </script>
